<section class="py-5" style="background-color: var(--bege); min-height: 40vh;">
  <div class="container">
    <h1 class="h2 mb-2">Catálogo</h1>
    <p class="mb-4" style="color: var(--barro);">Peças únicas, preço justo, moda circular.</p>

    <div class="row g-3 align-items-center mb-4">
      <div class="col-lg-8">
        <div class="d-flex flex-wrap gap-2">
          <button
            type="button"
            class="btn btn-sm rounded-pill"
            [class.text-white]="categoriaAtiva() === 'Todas'"
            [style.background-color]="categoriaAtiva() === 'Todas' ? 'var(--terracota)' : 'var(--creme)'"
            [style.color]="categoriaAtiva() === 'Todas' ? 'var(--creme)' : 'var(--barro)'"
            (click)="selecionarCategoria('Todas')"
          >
            Todas
          </button>
          @for (categoria of categorias; track categoria) {
            <button
              type="button"
              class="btn btn-sm rounded-pill"
              [style.background-color]="categoriaAtiva() === categoria ? 'var(--terracota)' : 'var(--creme)'"
              [style.color]="categoriaAtiva() === categoria ? 'var(--creme)' : 'var(--barro)'"
              (click)="selecionarCategoria(categoria)"
            >
              {{ categoria }}
            </button>
          }
        </div>
      </div>
      <div class="col-lg-4">
        <div class="input-group">
          <span class="input-group-text bg-white border-0"><i class="bi bi-search"></i></span>
          <input
            type="search"
            class="form-control border-0"
            placeholder="Buscar peça pelo nome..."
            [ngModel]="termoBusca()"
            (ngModelChange)="termoBusca.set($event)"
            aria-label="Buscar peça pelo nome"
          />
        </div>
      </div>
    </div>

    @if (produtosFiltrados().length > 0) {
      <div class="row g-4">
        @for (produto of produtosFiltrados(); track produto.id) {
          <div class="col-sm-6 col-lg-4 col-xl-3">
            <app-produto-card [produto]="produto" />
          </div>
        }
      </div>
    } @else {
      <div class="text-center py-5" style="color: var(--concreto);">
        <i class="bi bi-emoji-frown fs-1 d-block mb-2"></i>
        Nenhuma peça encontrada com esse filtro.
      </div>
    }
  </div>
</section>
